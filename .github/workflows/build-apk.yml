name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          # GitHub ubuntu-latest runners already have Android SDK 34 + build-tools 34.0.0 installed.
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode release keystore from GitHub Secret
        working-directory: android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "🔐 Decoding release keystore from GitHub Secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/mirrorpro-release.keystore
            echo "KEYSTORE_PATH=$HOME/mirrorpro-release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

            # Verify keystore is valid
            keytool -list -keystore $HOME/mirrorpro-release.keystore \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -alias "${{ secrets.KEY_ALIAS }}" | head -5
            echo "✅ Keystore verified"
          else
            echo "⚠️  No release keystore secret — falling back to debug keystore."
            mkdir -p ~/.android
            if [ ! -f ~/.android/debug.keystore ]; then
              keytool -genkey -v -keystore ~/.android/debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "KEYSTORE_PATH=$HOME/.android/debug.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build release APK (signed with release keystore)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        working-directory: android
        run: |
          APK=$(find . -name "*.apk" -path "*/outputs/apk/release/*" | head -1)
          if [ -z "$APK" ]; then
            echo "No release APK found, looking for debug..."
            APK=$(find . -name "*.apk" -path "*/outputs/apk/*" | head -1)
          fi
          echo "Verifying signature of: $APK"
          # Use apksigner to verify and print signer info
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner -type f | sort -V | tail -1)
          $APKSIGNER verify --verbose --print-certs "$APK" 2>&1 | head -20

      - name: Find APK
        id: apk
        working-directory: android
        run: |
          APK=$(find . -name "*.apk" -path "*/outputs/apk/*" | head -1)
          if [ -z "$APK" ]; then echo "No APK found"; exit 1; fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK)" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrorpro-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn

      - name: Create GitHub Release with APK
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MirrorPro APK Build #${{ github.run_number }}
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          prerelease: false
          body: |
            ## 🔐 Signed APK

            This APK is signed with a real release keystore (RSA 4096-bit, SHA256withRSA).

            ### Play Protect Warning

            Google Play Protect may show a warning because:
            1. This app requests `REQUEST_INSTALL_PACKAGES` (needed to install APK updates — it's the app's core feature)
            2. This app is not from the Play Store

            **To install:** Tap "More details" → "Install anyway".

            **This app is open source:** https://github.com/stephenmarcus89s-star/androidfk

            ### What's new
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "### APK Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Build succeeded!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📥 Download APK from [Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
            echo "📦 Or grab the latest [Release](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔐 Signed with release keystore (RSA 4096-bit, SHA256withRSA)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build failed.** Check the logs above." >> $GITHUB_STEP_SUMMARY
          fi
